# RUNNER COPY (generated from the private repository's workflows; master at railpariksha/ops/runner/ there).
# This public repository holds only workflow files, so every job runs on GitHub's free minutes for public repositories.
# Each run checks the private repository out into the workspace with the secret SOURCE_TOKEN; nothing else is published.
# Setup: railpariksha/docs/RUNNER.md in the private repository.
# Builds the RailPariksha content pack and SEO site as a downloadable workflow artifact.
# This does NOT deploy to GitHub Pages, since Pages is already wired to Bharari's site in this repo
# (see content_pack.yml) and a repo can only have one active Pages deployment source. To publish
# RailPariksha's pack for over-the-air updates, either serve this artifact from your own hosting and
# set CONTENT_URL, or fold "site" into a subpath of Bharari's Pages build once both apps are ready.
name: RailPariksha content pack
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit of the private repository (empty = its default branch)
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: railpariksha } }
    steps:
      - uses: actions/checkout@v4
        with:
          repository: aniketbabar97-commits/MahaPariksha
          ref: ${{ inputs.ref || vars.SOURCE_REF || 'aniketai/relaxed-albattani-6kjmc7' }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python pipeline/build_bundle.py --out site/content.json
      - run: python pipeline/build_site.py --out site
      - uses: actions/upload-artifact@v4
        with:
          name: railpariksha-content-site
          path: railpariksha/site
