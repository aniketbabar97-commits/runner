name: YouTube post
on:
  workflow_dispatch:
    inputs:
      name:
        description: Folder name under media/yt (e.g. app_coming_hi)
        required: true
run-name: YouTube post ${{ inputs.name }}

permissions:
  contents: read

env:
  APP_DIR: ${{ secrets.APP_DIR }}
  SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
  M1: ${{ secrets.M1 }}
  M2: ${{ secrets.M2 }}

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          ref: ${{ vars.SOURCE_REF || 'main' }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libraqm0
      - run: pip install -q pillow requests
      - run: python "$APP_DIR/pipeline/yt_post.py" "${{ inputs.name }}"
