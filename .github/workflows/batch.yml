name: old papers
on:
  workflow_dispatch:
    inputs:
      sheets:
        description: Folder of the sheets inside the private repository (it holds manifest.jsonl); "quota" only tests the keys
        required: true
      limit:
        description: Only the first N questions (empty = all); use a small number to test the keys
        required: false
      backends:
        description: gemini (one reader) or gemini,claude (two independent readers; needs ANTHROPIC_API_KEY)
        required: false
        default: gemini
      model:
        description: Gemini model (empty = gemini-2.5-flash-lite)
        required: false
      ref:
        description: Branch of the private repository (empty = its default branch)
        required: false

permissions:
  contents: read

env:
  APP_DIR: ${{ secrets.APP_DIR }}
  SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
  M1: ${{ secrets.M1 }}
  M2: ${{ secrets.M2 }}

jobs:
  type:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          ref: ${{ github.event.inputs.ref || vars.SOURCE_REF || 'aniketai/relaxed-albattani-6kjmc7' }}
          token: ${{ secrets.SOURCE_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow google-genai anthropic
      - name: Try the free open models
        if: ${{ github.event.inputs.sheets == 'open' }}
        run: |
          pip install easyocr transformers sentencepiece --extra-index-url https://download.pytorch.org/whl/cpu
          python pipeline/pyq/open_probe.py pipeline/pyq/work/probe
      - name: Test the keys
        if: ${{ github.event.inputs.sheets == 'quota' }}
        run: python pipeline/pyq/quota_probe.py 40
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Type them
        if: ${{ github.event.inputs.sheets != 'quota' && github.event.inputs.sheets != 'open' }}
        run: |
          n=$(wc -l < "${{ github.event.inputs.sheets }}/manifest.jsonl")
          echo "::notice::sheets: $n"
          python pipeline/pyq/transcribe.py type "${{ github.event.inputs.sheets }}" --out /tmp/typed.jsonl --backends "${{ github.event.inputs.backends }}" ${{ github.event.inputs.limit && format('--limit {0}', github.event.inputs.limit) || '' }} 2> /tmp/typed.err || true
          python - <<'PY'
          import json, collections
          rows = [json.loads(l) for l in open("/tmp/typed.jsonl") if l.strip()]
          print("::notice::typed: " + str(dict(collections.Counter(r["status"] for r in rows))))
          err = open("/tmp/typed.err").read().strip().splitlines()
          print("::notice::problems: " + str(dict(collections.Counter(err))) if err else "::notice::problems: none")
          PY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_MODEL: ${{ github.event.inputs.model || 'gemini-2.5-flash-lite' }}
      - name: Keep the result in the private repository
        if: ${{ github.event.inputs.sheets != 'quota' && github.event.inputs.sheets != 'open' }}
        run: |
          dest="pipeline/pyq/old/typed"
          mkdir -p "$dest"
          cp /tmp/typed.jsonl "$dest/typed_${{ github.run_id }}.jsonl"
          git config user.name "runner"; git config user.email "runner@users.noreply.github.com"
          git checkout -b "data/old-papers-${{ github.run_id }}"
          git add "$dest"
          git commit -m "Typed old papers"
          git push origin "HEAD:refs/heads/data/old-papers-${{ github.run_id }}"
