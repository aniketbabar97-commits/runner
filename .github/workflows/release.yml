name: release
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag of the private repository to build (empty = its default branch)
        required: false
      tag:
        description: Name of the release to create in the private repository (empty = build-<number>)
        required: false
      track:
        description: Play track (internal, alpha, beta, production)
        default: internal

permissions:
  contents: write

env:
  APP_DIR: ${{ secrets.APP_DIR }}
  SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
  M1: ${{ secrets.M1 }}
  M2: ${{ secrets.M2 }}

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}/app
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          ref: ${{ github.event.inputs.ref || vars.SOURCE_REF || 'aniketai/relaxed-albattani-6kjmc7' }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: python ../pipeline/build_bundle.py --pyq-full ../pyq_pack
      - name: Set up signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 secret missing"; exit 1; fi
          echo "$KEYSTORE" | base64 -d > android/upload.jks
          printf 'storeFile=../upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PW" "$ALIAS" "$KEY_PW" > android/key.properties
      - name: Version code from the clock
        run: echo "BUILD_NUMBER=$(( ($(date -u +%s) - 1790000000) / 60 ))" >> $GITHUB_ENV
      - run: flutter build appbundle --release --build-number=$BUILD_NUMBER --dart-define=USE_TEST_ADS=false --dart-define=TELEGRAM_URL=${{ vars.TELEGRAM_URL }}
      - run: flutter build apk --release --build-number=$BUILD_NUMBER --dart-define=USE_TEST_ADS=false --dart-define=TELEGRAM_URL=${{ vars.TELEGRAM_URL }}
      - name: Free disk space for the emulator's AVD
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk
          sudo docker image prune -af || true
          df -h /
      - name: Enable KVM for emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator and run the golden-path e2e test against the signed build
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: cd ${{ env.APP_DIR }}/app && flutter drive --driver=test_driver/integration_test.dart --target=integration_test/golden_path_test.dart -d emulator-5554 --profile --dart-define=USE_TEST_ADS=false
      - name: Run the same e2e test on Android 15 (edge-to-edge enforced)
        timeout-minutes: 20
        continue-on-error: true  # a report for now, not a release gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: cd ${{ env.APP_DIR }}/app && (mv screenshots screenshots-api34 2>/dev/null || true) && flutter drive --driver=test_driver/integration_test.dart --target=integration_test/golden_path_test.dart -d emulator-5554 --profile --dart-define=USE_TEST_ADS=false && mv screenshots screenshots-api35
      - name: Save the Android 15 screenshots for review
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE/$APP_DIR/app"
          d=""; for c in screenshots-api35 screenshots; do [ -d "$c" ] && ls "$c"/*.png >/dev/null 2>&1 && d="$c" && break; done
          [ -n "$d" ] || { echo "no Android 15 screenshots"; exit 0; }
          tmp=$(mktemp -d); cp "$d"/*.png "$tmp"/; cd "$tmp"
          git init -q -b shots && git add . && git -c user.name=runner -c user.email=runner@users.noreply.github.com commit -qm "e2e screenshots on Android 15 (run ${{ github.run_id }})"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${SOURCE_REPO}.git" HEAD:refs/heads/data/e2e-api35-${{ github.run_id }}
          echo "::notice::Android 15 screenshots on branch data/e2e-api35-${{ github.run_id }}"
      - name: Attach the AAB and APK to a release in the private repository
        env:
          GH_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          tag="${TAG_INPUT:-build-$BUILD_NUMBER}"
          cd "$GITHUB_WORKSPACE/$APP_DIR/app/build/app/outputs"
          cp bundle/release/app-release.aab "build-$BUILD_NUMBER.aab"
          cp flutter-apk/app-release.apk "build-$BUILD_NUMBER.apk"
          gh release create "$tag" --repo "$SOURCE_REPO" --prerelease --title "Build $BUILD_NUMBER" --notes "Built on the runner repository (no Actions minutes used here). Signed with the upload key." "build-$BUILD_NUMBER.aab" "build-$BUILD_NUMBER.apk"
          echo "release $tag created in the private repository"
      - name: Upload to Google Play
        if: ${{ env.PLAY_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ secrets.PKG_NAME }}
          releaseFiles: ${{ env.APP_DIR }}/app/build/app/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: ${{ (github.event.inputs.track || 'internal') == 'internal' && 'completed' || 'draft' }}
          whatsNewDirectory: ${{ env.APP_DIR }}/docs/store/whatsnew
