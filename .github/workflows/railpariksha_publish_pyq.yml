# Builds the previous-year-question packs the app downloads on demand and publishes them as assets of the release `d6c94d243b115` in
# THIS repository, so the app can fetch them while the source repository is private. Run it by hand whenever the PYQ content
# changes (rarely). Same files the app already offers to every student.
name: RailPariksha publish PYQ pack
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch of the private repository (empty = its default branch)
        required: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: aniketbabar97-commits/MahaPariksha
          ref: ${{ github.event.inputs.ref || vars.SOURCE_REF || 'aniketai/relaxed-albattani-6kjmc7' }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build the full PYQ pack
        working-directory: railpariksha/app
        run: python ../pipeline/build_bundle.py --pyq-full ../pyq_pack
      - name: Publish as release assets
        working-directory: railpariksha/pyq_pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in topics/*.json; do mv "$f" "topics__$(basename "$f")"; done
          gh release view d6c94d243b115 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create d6c94d243b115 --repo "$GITHUB_REPOSITORY" --prerelease --title "data (auto-updated)" --notes "App data. Not a release of the app."
          gh release upload d6c94d243b115 --repo "$GITHUB_REPOSITORY" *.json --clobber
          echo "uploaded $(ls *.json | wc -l) files"
