name: publish feed
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: publish-feed
  cancel-in-progress: false

env:
  APP_DIR: ${{ secrets.APP_DIR }}
  SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
  M1: ${{ secrets.M1 }}
  M2: ${{ secrets.M2 }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the feed from the source repository
        env:
          GH_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          SOURCE_REF: ${{ vars.SOURCE_REF || 'aniketai/relaxed-albattani-6kjmc7' }}
        run: |
          mkdir -p data/8a9bd92d30c1
          gh api -H "Accept: application/vnd.github.raw" "repos/$SOURCE_REPO/contents/$APP_DIR/content/ca_feed.json?ref=$SOURCE_REF" > data/8a9bd92d30c1/f.json.new
          python3 -c "import json; d = json.load(open('data/8a9bd92d30c1/f.json.new')); assert d, 'empty feed'; print('feed ok,', len(d), 'top-level entries')"
          mv data/8a9bd92d30c1/f.json.new data/8a9bd92d30c1/f.json
          if gh api -H "Accept: application/vnd.github.raw" "repos/$SOURCE_REPO/contents/$APP_DIR/content/question_fixes.json?ref=$SOURCE_REF" > data/8a9bd92d30c1/q.json.new 2>/dev/null \
             && python3 -c "import json; d = json.load(open('data/8a9bd92d30c1/q.json.new')); assert d.get('version') and isinstance(d.get('fixes'), list); print('fixes ok,', len(d['fixes']), 'questions')"; then
            mv data/8a9bd92d30c1/q.json.new data/8a9bd92d30c1/q.json
          else
            rm -f data/8a9bd92d30c1/q.json.new; echo "::warning::no valid question fixes file; the feed alone is published"
          fi
      - name: Commit the feed when it changed
        run: |
          git config user.name "runner"
          git config user.email "noreply@users.noreply.github.com"
          git add -A data/8a9bd92d30c1
          if git diff --cached --quiet; then echo "feed unchanged"; exit 0; fi
          git commit -m "Publish current-affairs feed and question fixes"
          # another job can push to main at the same moment: rebase on it and try again (12 Nov feed was lost to this)
          for i in 1 2 3; do git push && exit 0; git pull --rebase -q; done; exit 1
