name: Telegram
on:
  workflow_dispatch:
    inputs:
      slot:
        description: Which post to send now
        type: choice
        default: announce
        options: [announce, launch, setup, refresh, ca, quiz, poll_morning, fact, poll_noon, tip, poll_evening, weekly, monthly]
      text:
        description: Text for "announce" (plain text, sent as written)
        required: false
      force:
        description: Post even if the same kind of post went out in the last 40 minutes (normally that is skipped, so nothing is posted twice)
        type: boolean
        default: false
run-name: Telegram ${{ inputs.slot }}

permissions:
  contents: read
  actions: read

concurrency:
  group: telegram
  cancel-in-progress: false

env:
  APP_DIR: ${{ secrets.APP_DIR }}
  SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
  M1: ${{ secrets.M1 }}
  M2: ${{ secrets.M2 }}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - id: slot
        run: |
          s="${{ github.event.inputs.slot }}"
          case "$s" in quiz|fact|tip|weekly)
            if [ "${{ inputs.force }}" != "true" ]; then
              since=$(date -u -d '40 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
              n=""; for try in 1 2 3; do n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/telegram.yml/runs?created=%3E%3D$since&per_page=50" --jq "[.workflow_runs[] | select(.display_title==\"Telegram $s\" and .id < $GITHUB_RUN_ID) | select(.status!=\"completed\" or .conclusion==\"success\")] | length") && break; n=""; sleep 5; done; n=${n:-0}
              if [ "$n" -gt 0 ]; then echo "::warning::a $s post already went out in the last 40 minutes; skipping (tick force to post anyway)"; s=none; fi
            fi ;;
          esac
          echo "slot=$s" >> "$GITHUB_OUTPUT"
          if [ "$s" = none ]; then echo "::notice::nothing to post at this hour"
          elif [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then echo "have=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID not set; nothing to post."; fi
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - if: steps.slot.outputs.have == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          ref: ${{ vars.SOURCE_REF || 'aniketai/relaxed-albattani-6kjmc7' }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - if: steps.slot.outputs.have == 'true'
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - if: steps.slot.outputs.have == 'true' && (steps.slot.outputs.slot == 'monthly' || steps.slot.outputs.slot == 'fact')
        run: |
          sudo apt-get install -y --no-install-recommends libraqm0 || true
          pip install pillow
      - if: steps.slot.outputs.have == 'true'
        run: python "$APP_DIR/pipeline/telegram_bot.py" --slot "${{ steps.slot.outputs.slot }}" ${ANNOUNCE:+--text "$ANNOUNCE"}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANNOUNCE: ${{ github.event.inputs.text }}
