name: search ping
on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:
    inputs:
      all:
        description: Send every page in the sitemap (use once, or after a big change)
        type: boolean
        default: false
permissions:
  contents: read
env:
  APP_DIR: ${{ secrets.APP_DIR }}
  SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
  M1: ${{ secrets.M1 }}
  M2: ${{ secrets.M2 }}

jobs:
  ping:
    if: ${{ github.event_name != 'schedule' || vars.RUNNER_LIVE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          ref: ${{ vars.SOURCE_REF || 'aniketai/relaxed-albattani-6kjmc7' }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python "$APP_DIR/pipeline/indexnow.py" ${{ github.event.inputs.all == 'true' && '--all' || '' }}
